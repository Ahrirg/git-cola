name: PYINSTALL

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-linux:
    name: Build Linux (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pyqt6 \
            python3-pyqt6.qtsvg \
            python3-pyqt6.qtwebengine \
            python3-send2trash
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build binary
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name git-cola \
            cola/__main__.py
      - name: Package artifact
        shell: bash
        run: |
          mkdir release
          cp dist/git-cola release/
          cd release
          tar -czf ../${{ matrix.name }}.tar.gz *
          cd ..
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}.tar.gz
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build binary
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name git-cola `
            cola/__main__.py
      - name: Package artifact
        shell: pwsh
        run: |
          mkdir release
          copy dist\git-cola.exe release\
          Compress-Archive `
            -Path release\* `
            -DestinationPath windows-x86_64.zip
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: windows-x86_64.zip
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x86_64
            runner: macos-13
          - name: macos-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build binary
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --windowed \
            --name git-cola \
            cola/__main__.py
      - name: Package artifact
        shell: bash
        run: |
          mkdir release
          cp dist/git-cola release/
          cd release
          tar -czf ../${{ matrix.name }}.tar.gz *
          cd ..
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}.tar.gz
